<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quick View - Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .modal-custom {
      max-width: 1000px;
      margin: 5% auto;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    .color-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .product-size button {
      min-width: 45px;
    }
  </style>
</head>
<body class="bg-dark bg-opacity-50">

<!-- Quick View Modal Content -->
<div class="modal-custom p-4">
  <div class="d-flex justify-content-end">
    <a href="#" onclick="window.close()" class="btn-close"></a>
  </div>
  <div class="row g-4">
    <div class="col-md-6 text-center">
      <img src="https://cdn.shopify.com/s/files/1/0253/6561/5739/products/Alpaca-Crewneck-Beige_600x.jpg" class="img-fluid mb-3" alt="Sweater">
      <img src="https://cdn.shopify.com/s/files/1/0253/6561/5739/products/Alpaca-Crewneck-Model_600x.jpg" class="img-fluid" alt="Model">
    </div>
    <div class="col-md-6">
      <h4>Alpaca Wool Crewneck Sweater</h4>
      <p class="text-muted fs-5">$248</p>

      <p class="mb-1 fw-bold">Product Color: Beige</p>
      <div class="mb-3">
        <span class="color-circle" style="background-color: black;"></span>
        <span class="color-circle" style="background-color: beige;"></span>
        <span class="color-circle" style="background-color: lightblue;"></span>
      </div>

      <p class="fw-bold mb-1">Product Size:</p>
      <div class="product-size d-flex gap-2 flex-wrap mb-3">
        <button class="btn btn-outline-secondary btn-sm">XS</button>
        <button class="btn btn-outline-secondary btn-sm">S</button>
        <button class="btn btn-outline-secondary btn-sm">M</button>
        <button class="btn btn-outline-secondary btn-sm">L</button>
        <button class="btn btn-outline-secondary btn-sm">XL</button>
        <a href="#" class="ms-2">Size Chart</a>
      </div>

      <button class="btn btn-dark w-100 mb-2">Add to Bag</button>
      <a href="#">View Full Details</a>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
