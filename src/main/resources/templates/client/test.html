<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="row">
    <div th:each="product : ${products}" class="col-lg-3 col-md-6 mb-4">
        <div class="card product-card">
            <a th:href="@{'/' + ${product.id}}">
                <div class="product-image">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}" class="img-fluid">
                </div>
            </a>
            <div class="product-info">
                <h5 class="product-title" th:text="${product.name}"></h5>
                <p class="product-price"
                   th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
