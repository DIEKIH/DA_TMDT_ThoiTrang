<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- Template: discount/list.html -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chương trình giảm giá</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .discount-card {
            border-left: 4px solid #007bff;
            transition: transform 0.2s;
        }
        .discount-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .badge-inactive { background-color: #dc3545; }
        .badge-active { background-color: #198754; }
        .discount-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #dc3545;
        }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-percent me-2"></i>Quản lý chương trình giảm giá</h2>
        <a href="/admin/discounts/create" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Tạo chương trình mới
        </a>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Discount List -->
    <div class="row" th:if="${discounts.hasContent()}">
        <div class="col-md-6 col-lg-4 mb-4" th:each="discount : ${discounts.content}">
            <div class="card discount-card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0" th:text="${discount.name}">Tên chương trình</h6>
                    <span class="badge" th:class="${discount.isActive} ? 'badge-active' : 'badge-inactive'"
                          th:text="${discount.isActive} ? 'Đang hoạt động' : 'Đã dừng'"></span>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-2" th:if="${discount.description}" th:text="${discount.description}"></p>

                    <div class="discount-value mb-3">
                        <span th:text="${discount.value}"></span>
                        <span th:if="${discount.valueType?.name() == 'PERCENTAGE'}">%</span>
                        <span th:if="${discount.valueType?.name() == 'FIXED_AMOUNT'}">đ</span>
                    </div>

                    <div class="small text-muted">
                        <div><strong>Loại:</strong>
                            <span th:switch="${discount.type?.name()}">
                                    <span th:case="'PRODUCT'">Sản phẩm</span>
                                    <span th:case="'CATEGORY'">Danh mục</span>
                                    <span th:case="'BRAND'">Thương hiệu</span>
                                </span>
                        </div>
                        <div th:if="${discount.startDate}">
                            <strong>Từ:</strong> <span th:text="${#temporals.format(discount.startDate, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                        <div th:if="${discount.endDate}">
                            <strong>Đến:</strong> <span th:text="${#temporals.format(discount.endDate, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="btn-group w-100" role="group">
                        <a th:href="@{/admin/discounts/{id}/edit(id=${discount.id})}" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/admin/discounts/{id}/products(id=${discount.id})}" class="btn btn-outline-info btn-sm">
                            <i class="fas fa-box"></i>
                        </a>
                        <form th:action="@{/admin/discounts/{id}/soft-delete(id=${discount.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-warning btn-sm"
                                    th:if="${discount.isActive}"
                                    onclick="return confirm('Xác nhận ngưng chương trình này?')">
                                <i class="fas fa-pause"></i>
                            </button>
                        </form>
                        <form th:action="@{/admin/discounts/{id}/delete(id=${discount.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Xác nhận xóa vĩnh viễn chương trình này?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${!discounts.hasContent()}" class="text-center py-5">
        <i class="fas fa-percent fa-3x text-muted mb-3"></i>
        <h4>Chưa có chương trình giảm giá nào</h4>
        <p class="text-muted">Tạo chương trình giảm giá đầu tiên của bạn</p>
        <a href="/discounts/create" class="btn btn-primary">Tạo ngay</a>
    </div>

    <!-- Pagination -->
    <nav th:if="${discounts.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:class="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/discounts(page=${currentPage - 1})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:class="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/discounts(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:class="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/discounts(page=${currentPage + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
