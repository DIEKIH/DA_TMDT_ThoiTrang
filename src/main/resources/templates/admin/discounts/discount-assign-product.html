<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gán sản phẩm cho chương trình giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3>Gán sản phẩm cho chương trình:
                        <span th:text="${discount.name}" class="text-primary fw-bold"></span>
                    </h3>
                </div>
                <div class="card-body">
                    <!-- Form gán sản phẩm -->
                    <form class="row mb-4" onsubmit="assignProduct(event)">
                        <div class="col-md-8">
                            <select class="form-select" id="productSelect" required>
                                <option value="">-- Chọn sản phẩm để gán --</option>
                                <option th:each="product : ${availableProducts}"
                                        th:value="${product.id}"
                                        th:text="${product.name + ' - ' + #numbers.formatDecimal(product.price, 0, 'POINT',  ',', '.') + ' VND'}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4 d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Gán sản phẩm
                            </button>
                        </div>
                    </form>

                    <hr>

                    <!-- Danh sách sản phẩm đã gán -->
                    <h5 class="mb-3">Danh sách sản phẩm đã được gán:</h5>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Tên sản phẩm</th>
                                <th>Giá gốc</th>
                                <th>Giá sau giảm</th>
                                <th>Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="product : ${assignedProducts}">
                                <td th:text="${product.id}">1</td>
                                <td th:text="${product.name}">Tên SP</td>
                                <td th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', ',', '.') + ' VND'}">0 VND</td>
                                <td>
                                    <span class="text-success fw-bold"
                                          th:text="${T(com.example.da_tmdt_thoitrang.util.PriceUtils).calculateDiscountedPrice(product.price, discount) + ' VND'}">
                                    </span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-danger"
                                            th:onclick="|removeProduct(${product.id})|">
                                        <i class="fas fa-trash"></i> Xóa
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <div th:if="${#lists.isEmpty(assignedProducts)}" class="text-center py-4">
                            <p class="text-muted">Chưa có sản phẩm nào được gán cho chương trình giảm giá này.</p>
                        </div>
                    </div>

                    <div class="mt-4">
                        <a href="/admin/discounts" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Quay lại danh sách
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS for assign/remove -->
<script th:inline="javascript">
    const discountId = /*[[${discount.id}]]*/ 0;

    function assignProduct(event) {
        event.preventDefault();

        const productSelect = document.getElementById('productSelect');
        const productId = productSelect.value;

        if (!productId) {
            alert('Vui lòng chọn sản phẩm để gán.');
            return;
        }

        fetch(`/admin/discounts/${discountId}/products`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ productId: parseInt(productId) })
        })
            .then(res => {
                if (res.ok) {
                    location.reload();
                } else {
                    return res.text().then(msg => {
                        throw new Error(msg || 'Có lỗi xảy ra khi gán sản phẩm');
                    });
                }
            })
            .catch(error => alert(error.message));
    }

    function removeProduct(productId) {
        if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi chương trình giảm giá?')) {
            fetch(`/admin/discounts/${discountId}/products/${productId}`, {
                method: 'DELETE'
            })
                .then(res => {
                    if (res.ok) {
                        location.reload();
                    } else {
                        alert('Có lỗi xảy ra khi xóa sản phẩm');
                    }
                });
        }
    }
</script>
</body>
</html>
