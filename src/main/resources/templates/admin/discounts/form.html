<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${discount.id != null ? 'Sửa chương trình giảm giá' : 'Tạo chương trình giảm giá mới'}"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid mt-3" id="discount-form-page" >
  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle"></i> Tạo chương trình giảm giá</h2>
        <a href="/admin/discounts" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
      </div>

      <form method="POST" action="/admin/discounts/create">
        <div class="row">
          <!-- Left Column - Basic Info -->
          <div class="col-md-8">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0">Thông tin cơ bản</h5>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Tên chương trình <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name"
                           placeholder="VD: Giảm giá Tết 2025" required>
                    <div class="invalid-feedback">Vui lòng nhập tên chương trình</div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="type" class="form-label">Loại giảm giá <span class="text-danger">*</span></label>
                    <select class="form-select" id="type" name="type" required>
                      <option value="">-- Chọn loại --</option>
                      <option value="PRODUCT">Sản phẩm cụ thể</option>
                      <option value="CATEGORY">Danh mục</option>
                      <option value="BRAND">Thương hiệu</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="description" class="form-label">Mô tả</label>
                  <textarea class="form-control" id="description" name="description" rows="3"
                            placeholder="Mô tả chi tiết về chương trình giảm giá..."></textarea>
                </div>

                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label for="valueType" class="form-label">Kiểu giảm giá <span class="text-danger">*</span></label>
                    <select class="form-select" id="valueType" name="valueType" required onchange="toggleValueInput()">
                      <option value="">-- Chọn kiểu --</option>
                      <option value="PERCENTAGE">Phần trăm (%)</option>
                      <option value="FIXED_AMOUNT">Số tiền cố định</option>
                    </select>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="value" class="form-label">Giá trị <span class="text-danger">*</span></label>
                    <div class="input-group">
                      <input type="number" class="form-control" id="value" name="value"
                             step="0.01" min="0" required>
                      <span class="input-group-text" id="value-suffix">%</span>
                    </div>
                    <div class="form-text" id="value-help">Nhập giá trị từ 0-100 cho %</div>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="isActive" class="form-label">Trạng thái</label>
                    <div class="form-check form-switch mt-2">
                      <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
                      <label class="form-check-label" for="isActive">Kích hoạt ngay</label>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="startDate" class="form-label">Ngày bắt đầu</label>
                    <input type="datetime-local" class="form-control" id="startDate" name="startDate">
                    <div class="form-text">Để trống để áp dụng ngay lập tức</div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="endDate" class="form-label">Ngày kết thúc</label>
                    <input type="datetime-local" class="form-control" id="endDate" name="endDate">
                    <div class="form-text">Để trống để không giới hạn thời gian</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Column - Product Selection -->
          <div class="col-md-4">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0">Chọn sản phẩm áp dụng</h5>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <input type="text" class="form-control" id="productSearch"
                         placeholder="Tìm kiếm sản phẩm..." onkeyup="filterProducts()">
                </div>

                <div class="mb-3">
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="selectAllProducts()">
                    Chọn tất cả
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearAllProducts()">
                    Bỏ chọn tất cả
                  </button>
                </div>

                <div class="product-list" style="max-height: 400px; overflow-y: auto;">
                  <!-- Sample products - Replace with dynamic data -->
                  <div class="form-check mb-2 product-item">
                    <input class="form-check-input" type="checkbox" name="productIds" value="1" id="product1">
                    <label class="form-check-label" for="product1">
                      <strong>iPhone 15 Pro</strong><br>
                      <small class="text-muted">25,000,000đ</small>
                    </label>
                  </div>
                  <div class="form-check mb-2 product-item">
                    <input class="form-check-input" type="checkbox" name="productIds" value="2" id="product2">
                    <label class="form-check-label" for="product2">
                      <strong>Samsung Galaxy S24</strong><br>
                      <small class="text-muted">20,000,000đ</small>
                    </label>
                  </div>
                  <div class="form-check mb-2 product-item">
                    <input class="form-check-input" type="checkbox" name="productIds" value="3" id="product3">
                    <label class="form-check-label" for="product3">
                      <strong>MacBook Pro M3</strong><br>
                      <small class="text-muted">45,000,000đ</small>
                    </label>
                  </div>
                  <div class="form-check mb-2 product-item">
                    <input class="form-check-input" type="checkbox" name="productIds" value="4" id="product4">
                    <label class="form-check-label" for="product4">
                      <strong>Dell XPS 15</strong><br>
                      <small class="text-muted">35,000,000đ</small>
                    </label>
                  </div>
                </div>

                <div class="mt-3 p-2 bg-light rounded">
                  <small class="text-muted">
                    <i class="bi bi-info-circle"></i>
                    Đã chọn: <span id="selected-count">0</span> sản phẩm
                  </small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="row mt-4">
          <div class="col-12">
            <div class="card">
              <div class="card-body text-end">
                <a href="/admin/discounts" class="btn btn-secondary me-2">
                  <i class="bi bi-x-circle"></i> Hủy
                </a>
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-circle"></i> Tạo chương trình
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function updateValueInput() {
    const valueType = document.getElementById('valueType').value;
    const valueUnit = document.getElementById('valueUnit');
    const valueInput = document.getElementById('value');

    if (valueType === 'PERCENTAGE') {
      valueUnit.textContent = '%';
      valueInput.setAttribute('max', '100');
    } else {
      valueUnit.textContent = 'VND';
      valueInput.removeAttribute('max');
    }
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    updateValueInput();
  });
</script>
</body>
</html>
