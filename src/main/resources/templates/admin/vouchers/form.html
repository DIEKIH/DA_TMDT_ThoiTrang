<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--  <title th:text="${isEdit ? 'Chỉnh sửa Voucher' : 'Thêm Voucher'}">Thêm Voucher</title>-->
  <title th:text="${isEdit != null and isEdit ? 'Chỉnh sửa Voucher' : 'Thêm Voucher'}">Thêm Voucher</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3 col-lg-2 bg-dark text-white p-3">
      <h5><i class="fas fa-cog"></i> Admin Panel</h5>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link text-white active" href="/admin/vouchers">
            <i class="fas fa-ticket-alt"></i> Voucher
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="/admin/orders">
            <i class="fas fa-shopping-cart"></i> Đơn hàng
          </a>
        </li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="col-md-9 col-lg-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
          <i class="fas fa-ticket-alt"></i>
<!--          <span th:text="${isEdit ? 'Chỉnh sửa Voucher' : 'Thêm Voucher'}">Thêm Voucher</span>-->
          <span th:text="${isEdit != null and isEdit ? 'Chỉnh sửa Voucher' : 'Thêm Voucher'}">Thêm Voucher</span>
        </h2>
        <a href="/admin/vouchers" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-left"></i> Quay lại
        </a>
      </div>

      <!-- Error Message -->
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Form -->
      <div class="card shadow">
        <div class="card-body">
          <form th:object="${voucherDto}" method="post" novalidate>
            <div class="row">
              <!-- Mã Voucher -->
              <div class="col-md-6 mb-3">
                <label for="code" class="form-label">Mã Voucher <span class="text-danger">*</span></label>
                <input type="text"
                       class="form-control"
                       id="code"
                       th:field="*{code}"
                       th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''"
                       placeholder="Nhập mã voucher">
                <div th:if="${#fields.hasErrors('code')}" class="invalid-feedback">
                  <span th:errors="*{code}"></span>
                </div>
              </div>

              <!-- Tên Voucher -->
              <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Tên Voucher <span class="text-danger">*</span></label>
                <input type="text"
                       class="form-control"
                       id="name"
                       th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                       placeholder="Nhập tên voucher">
                <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback">
                  <span th:errors="*{name}"></span>
                </div>
              </div>
            </div>

            <!-- Mô tả -->
            <div class="mb-3">
              <label for="description" class="form-label">Mô tả</label>
              <textarea class="form-control"
                        id="description"
                        th:field="*{description}"
                        rows="3"
                        placeholder="Nhập mô tả voucher"></textarea>
            </div>

            <div class="row">
              <!-- Loại Voucher -->
              <div class="col-md-6 mb-3">
                <label for="type" class="form-label">Loại Voucher <span class="text-danger">*</span></label>
                <select class="form-select"
                        id="type"
                        th:field="*{type}"
                        th:classappend="${#fields.hasErrors('type')} ? 'is-invalid' : ''"
                        onchange="toggleValueLabel()">
                  <option value="">Chọn loại voucher</option>
                  <option th:each="voucherType : ${voucherTypes}"
                          th:value="${voucherType}"
                          th:text="${voucherType.name() == 'PERCENTAGE' ? 'Phần trăm' : 'Cố định'}">
                  </option>
                </select>
                <div th:if="${#fields.hasErrors('type')}" class="invalid-feedback">
                  <span th:errors="*{type}"></span>
                </div>
              </div>

              <!-- Giá trị -->
              <div class="col-md-6 mb-3">
                <label for="value" class="form-label">
                  <span id="valueLabel">Giá trị</span> <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <input type="number"
                         class="form-control"
                         id="value"
                         th:field="*{value}"
                         th:classappend="${#fields.hasErrors('value')} ? 'is-invalid' : ''"
                         step="0.01"
                         min="0"
                         placeholder="0">
                  <span class="input-group-text" id="valueUnit">₫</span>
                </div>
                <div th:if="${#fields.hasErrors('value')}" class="invalid-feedback">
                  <span th:errors="*{value}"></span>
                </div>
              </div>
            </div>

            <div class="row">
              <!-- Đơn hàng tối thiểu -->
              <div class="col-md-6 mb-3">
                <label for="minOrderAmount" class="form-label">Đơn hàng tối thiểu</label>
                <div class="input-group">
                  <input type="number"
                         class="form-control"
                         id="minOrderAmount"
                         th:field="*{minOrderAmount}"
                         th:classappend="${#fields.hasErrors('minOrderAmount')} ? 'is-invalid' : ''"
                         step="0.01"
                         min="0"
                         placeholder="0">
                  <span class="input-group-text">₫</span>
                </div>
                <div th:if="${#fields.hasErrors('minOrderAmount')}" class="invalid-feedback">
                  <span th:errors="*{minOrderAmount}"></span>
                </div>
              </div>

              <!-- Giảm tối đa -->
              <div class="col-md-6 mb-3">
                <label for="maxDiscountAmount" class="form-label">Giảm tối đa</label>
                <div class="input-group">
                  <input type="number"
                         class="form-control"
                         id="maxDiscountAmount"
                         th:field="*{maxDiscountAmount}"
                         th:classappend="${#fields.hasErrors('maxDiscountAmount')} ? 'is-invalid' : ''"
                         step="0.01"
                         min="0"
                         placeholder="0">
                  <span class="input-group-text">₫</span>
                </div>
                <div th:if="${#fields.hasErrors('maxDiscountAmount')}" class="invalid-feedback">
                  <span th:errors="*{maxDiscountAmount}"></span>
                </div>
                <div class="form-text">Chỉ áp dụng cho voucher phần trăm</div>
              </div>
            </div>

            <div class="row">
              <!-- Số lượt sử dụng -->
              <div class="col-md-4 mb-3">
                <label for="usageLimit" class="form-label">Số lượt sử dụng</label>
                <input type="number"
                       class="form-control"
                       id="usageLimit"
                       th:field="*{usageLimit}"
                       th:classappend="${#fields.hasErrors('usageLimit')} ? 'is-invalid' : ''"
                       min="1"
                       placeholder="Không giới hạn">
                <div th:if="${#fields.hasErrors('usageLimit')}" class="invalid-feedback">
                  <span th:errors="*{usageLimit}"></span>
                </div>
              </div>

              <!-- Ngày bắt đầu -->
              <div class="col-md-4 mb-3">
                <label for="startDate" class="form-label">Ngày bắt đầu</label>
                <input type="datetime-local"
                       class="form-control"
                       id="startDate"
                       th:field="*{startDate}">
              </div>

              <!-- Ngày kết thúc -->
              <div class="col-md-4 mb-3">
                <label for="endDate" class="form-label">Ngày kết thúc</label>
                <input type="datetime-local"
                       class="form-control"
                       id="endDate"
                       th:field="*{endDate}">
              </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between">
              <a href="/admin/vouchers" class="btn btn-outline-secondary">
                <i class="fas fa-times"></i> Hủy
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i>
                <span th:text="${isEdit ? 'Cập nhật' : 'Tạo mới'}">Tạo mới</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function toggleValueLabel() {
    const type = document.getElementById('type').value;
    const valueLabel = document.getElementById('valueLabel');
    const valueUnit = document.getElementById('valueUnit');

    if (type === 'PERCENTAGE') {
      valueLabel.textContent = 'Phần trăm giảm';
      valueUnit.textContent = '%';
    } else {
      valueLabel.textContent = 'Số tiền giảm';
      valueUnit.textContent = '₫';
    }
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    toggleValueLabel();
  });
</script>
</body>
</html>
