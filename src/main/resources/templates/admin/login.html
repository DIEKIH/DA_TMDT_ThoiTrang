<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - Fashion Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }
        .brand-section {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3rem 2rem;
            border-radius: 15px 0 0 15px;
        }
        .form-section {
            padding: 3rem 2rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: translateY(-1px);
        }
        .admin-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .brand-section {
                border-radius: 15px 15px 0 0;
                padding: 2rem 1.5rem;
            }
            .form-section {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
            <div class="card auth-card rounded-4 overflow-hidden">
                <div class="row g-0">
                    <!-- Brand Section -->
                    <div class="col-md-5 d-flex align-items-center">
                        <div class="brand-section w-100 text-center">
                            <div class="admin-badge d-inline-block">
                                <i class="fas fa-shield-alt me-2"></i>ADMIN PANEL
                            </div>
                            <h2 class="fw-bold mb-3">Fashion Store</h2>
                            <p class="mb-4 opacity-75">Hệ thống quản trị thời trang hiện đại</p>
                            <div class="d-flex justify-content-center">
                                <div class="text-center mx-3">
                                    <i class="fas fa-users fa-2x mb-2"></i>
                                    <div class="small">Quản lý người dùng</div>
                                </div>
                                <div class="text-center mx-3">
                                    <i class="fas fa-shopping-bag fa-2x mb-2"></i>
                                    <div class="small">Quản lý sản phẩm</div>
                                </div>
                                <div class="text-center mx-3">
                                    <i class="fas fa-chart-line fa-2x mb-2"></i>
                                    <div class="small">Thống kê</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Section -->
                    <div class="col-md-7">
                        <div class="form-section">
                            <h3 class="fw-bold mb-4 text-center">Đăng nhập Admin</h3>

                            <!-- Success Message -->
                            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                                <i class="fas fa-check-circle me-2"></i>
                                <span th:text="${success}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <!-- Error Message -->
                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                <span th:text="${error}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <form th:action="@{/admin/login}" th:object="${loginDto}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label fw-semibold">
                                        <i class="fas fa-user me-2"></i>Tên đăng nhập
                                    </label>
                                    <input type="text" th:field="*{username}" class="form-control" id="username" required>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label fw-semibold">
                                        <i class="fas fa-lock me-2"></i>Mật khẩu
                                    </label>
                                    <input type="password" th:field="*{password}" class="form-control" id="password" required>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                                </button>
                            </form>

                            <div class="text-center">
                                <p class="mb-0">Chưa có tài khoản admin?
                                    <a th:href="@{/admin/register}" class="text-decoration-none fw-semibold">Đăng ký ngay</a>
                                </p>
                                <hr class="my-3">
                                <a th:href="@{/client/login}" class="btn btn-outline-secondary">
                                    <i class="fas fa-user me-2"></i>Đăng nhập khách hàng
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
