<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thương hiệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .brand-logo {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }
        .status-badge {
            font-size: 0.8rem;
        }
        .search-box {
            max-width: 400px;
        }
        .table-actions {
            min-width: 150px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-4">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="mb-1"><i class="fas fa-tags text-primary"></i> Quản lý Thương hiệu</h2>
                    <p class="text-muted mb-0">Quản lý danh sách các thương hiệu trong hệ thống</p>
                </div>
                <div class="text-end">
                    <small class="text-muted">Xin chào, <strong th:text="${adminUsername}">Admin</strong></small>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Controls -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <form method="get" th:action="@{/admin/brands}" class="d-flex">
                        <div class="input-group search-box">
                            <input type="text" name="search" class="form-control"
                                   placeholder="Tìm kiếm thương hiệu..."
                                   th:value="${search}">
                            <button class="btn btn-outline-secondary" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <a th:href="@{/admin/brands/add}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Thêm thương hiệu
                    </a>
                    <a th:href="@{/admin/brands}" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-refresh me-2"></i>Làm mới
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Brands Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">
                <i class="fas fa-list me-2"></i>Danh sách thương hiệu
                <span class="badge bg-secondary" th:text="${#lists.size(brands)}">0</span>
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th width="5%">#</th>
                        <th width="10%">Logo</th>
                        <th width="20%">Tên thương hiệu</th>
                        <th width="30%">Mô tả</th>
                        <th width="10%">Trạng thái</th>
                        <th width="15%">Ngày tạo</th>
                        <th width="10%" class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(brands)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <p class="mb-0">Không có thương hiệu nào</p>
                        </td>
                    </tr>
                    <tr th:each="brand, iterStat : ${brands}" th:class="${brand.isActive} ? '' : 'table-secondary'">
                        <td th:text="${iterStat.count}">1</td>
                        <td>
                            <div th:if="${brand.logoUrl != null and brand.logoUrl != ''}">
                                <img th:src="${brand.logoUrl}" alt="Logo" class="brand-logo">
                            </div>
                            <div th:unless="${brand.logoUrl != null and brand.logoUrl != ''}"
                                 class="brand-logo bg-light d-flex align-items-center justify-content-center">
                                <i class="fas fa-image text-muted"></i>
                            </div>
                        </td>
                        <td>
                            <strong th:text="${brand.name}">Brand Name</strong>
                        </td>
                        <td>
                                    <span th:text="${brand.description != null ? brand.description : 'Chưa có mô tả'}"
                                          th:class="${brand.description != null ? '' : 'text-muted'}">Description</span>
                        </td>
                        <td>
                                    <span th:if="${brand.isActive}" class="badge bg-success status-badge">
                                        <i class="fas fa-check me-1"></i>Hoạt động
                                    </span>
                            <span th:unless="${brand.isActive}" class="badge bg-danger status-badge">
                                        <i class="fas fa-times me-1"></i>Tạm dừng
                                    </span>
                        </td>
                        <td>
                            <small th:text="${#temporals.format(brand.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2024 10:00</small>
                        </td>
                        <td class="text-center table-actions">
                            <div class="btn-group" role="group">
                                <a th:href="@{/admin/brands/edit/{id}(id=${brand.id})}"
                                   class="btn btn-sm btn-outline-primary" title="Sửa">
                                    <i class="fas fa-edit"></i>
                                </a>

                                <button th:if="${brand.isActive}"
                                        class="btn btn-sm btn-outline-warning"
                                        onclick="confirmAction('deactivate', [[${brand.id}]], '[[${brand.name}]]')"
                                        title="Tạm dừng">
                                    <i class="fas fa-pause"></i>
                                </button>

                                <button th:unless="${brand.isActive}"
                                        class="btn btn-sm btn-outline-success"
                                        onclick="confirmAction('activate', [[${brand.id}]], '[[${brand.name}]]')"
                                        title="Kích hoạt">
                                    <i class="fas fa-play"></i>
                                </button>

                                <button class="btn btn-sm btn-outline-danger"
                                        onclick="confirmAction('delete', [[${brand.id}]], '[[${brand.name}]]')"
                                        title="Xóa">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Hidden Forms for Actions -->
<form id="actionForm" method="post" style="display: none;">
    <input type="hidden" name="_method" value="POST">
</form>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Xác nhận thao tác</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger" id="confirmBtn">Xác nhận</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmAction(action, id, name) {
        let message, url, btnClass, btnText;

        switch(action) {
            case 'delete':
                message = `Bạn có chắc chắn muốn xóa thương hiệu "${name}"?`;
                url = `/admin/brands/delete/${id}`;
                btnClass = 'btn-danger';
                btnText = 'Xóa';
                break;
            case 'activate':
                message = `Bạn có muốn kích hoạt thương hiệu "${name}"?`;
                url = `/admin/brands/activate/${id}`;
                btnClass = 'btn-success';
                btnText = 'Kích hoạt';
                break;
            case 'deactivate':
                message = `Bạn có muốn tạm dừng thương hiệu "${name}"?`;
                url = `/admin/brands/deactivate/${id}`;
                btnClass = 'btn-warning';
                btnText = 'Tạm dừng';
                break;
        }

        document.getElementById('confirmMessage').textContent = message;
        const confirmBtn = document.getElementById('confirmBtn');
        confirmBtn.className = `btn ${btnClass}`;
        confirmBtn.textContent = btnText;
        confirmBtn.onclick = function() {
            document.getElementById('actionForm').action = url;
            document.getElementById('actionForm').submit();
        };

        new bootstrap.Modal(document.getElementById('confirmModal')).show();
    }
</script>
</body>
</html>
