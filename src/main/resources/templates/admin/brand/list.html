<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý giảm giá - Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin_nav.css}">
</head>
<body>
    <!-- Sidebar -->
    <div th:replace="fragments/admin_sidebar :: admin_sidebar"></div>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Navbar -->
        <div th:replace="fragments/admin_navbar :: admin_navbar"></div>

        <!-- Dashboard Content -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <form method="get" th:action="@{/admin/brands}" class="d-flex">
                            <div class="input-group search-box">
                                <input type="text" name="search" class="form-control"
                                       placeholder="Tìm kiếm thương hiệu..."
                                       th:value="${search}">
                                <button class="btn btn-outline-secondary" type="submit">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="col-md-6 text-md-end mt-3 mt-md-0">
                        <a th:href="@{/admin/brands/add}" class="btn btn-primary">
                            <i class="fas fa-plus me-2"></i>Thêm thương hiệu
                        </a>
                        <a th:href="@{/admin/brands}" class="btn btn-outline-secondary ms-2">
                            <i class="fas fa-refresh me-2"></i>Làm mới
                        </a>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Brands Table -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">
                    <i class="fas fa-list me-2"></i>Danh sách thương hiệu
                    <span class="badge bg-secondary" th:text="${#lists.size(brands)}">0</span>
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th width="5%">#</th>
                            <th width="10%">Logo</th>
                            <th width="20%">Tên thương hiệu</th>
                            <th width="30%">Mô tả</th>
                            <th width="10%">Trạng thái</th>
                            <th width="15%">Ngày tạo</th>
                            <th width="10%" class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(brands)}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="fas fa-inbox fa-3x mb-3"></i>
                                <p class="mb-0">Không có thương hiệu nào</p>
                            </td>
                        </tr>
                        <tr th:each="brand, iterStat : ${brands}" th:class="${brand.isActive} ? '' : 'table-secondary'">
                            <td th:text="${iterStat.count}">1</td>
                            <td>
                                <div th:if="${brand.logoUrl != null and brand.logoUrl != ''}">
                                    <img th:src="${brand.logoUrl}" alt="Logo" class="brand-logo">
                                </div>
                                <div th:unless="${brand.logoUrl != null and brand.logoUrl != ''}"
                                     class="brand-logo bg-light d-flex align-items-center justify-content-center">
                                    <i class="fas fa-image text-muted"></i>
                                </div>
                            </td>
                            <td>
                                <strong th:text="${brand.name}">Brand Name</strong>
                            </td>
                            <td>
                                        <span th:text="${brand.description != null ? brand.description : 'Chưa có mô tả'}"
                                              th:class="${brand.description != null ? '' : 'text-muted'}">Description</span>
                            </td>
                            <td>
                                        <span th:if="${brand.isActive}" class="badge bg-success status-badge">
                                            <i class="fas fa-check me-1"></i>Hoạt động
                                        </span>
                                <span th:unless="${brand.isActive}" class="badge bg-danger status-badge">
                                            <i class="fas fa-times me-1"></i>Tạm dừng
                                        </span>
                            </td>
                            <td>
                                <small th:text="${#temporals.format(brand.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2024 10:00</small>
                            </td>
                            <td class="text-center table-actions">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/admin/brands/edit/{id}(id=${brand.id})}"
                                       class="btn btn-sm btn-outline-primary" title="Sửa">
                                        <i class="fas fa-edit"></i>
                                    </a>
    
                                    <button th:if="${brand.isActive}"
                                            class="btn btn-sm btn-outline-warning"
                                            onclick="confirmAction('deactivate', [[${brand.id}]], '[[${brand.name}]]')"
                                            title="Tạm dừng">
                                        <i class="fas fa-pause"></i>
                                    </button>
    
                                    <button th:unless="${brand.isActive}"
                                            class="btn btn-sm btn-outline-success"
                                            onclick="confirmAction('activate', [[${brand.id}]], '[[${brand.name}]]')"
                                            title="Kích hoạt">
                                        <i class="fas fa-play"></i>
                                    </button>
    
                                    <button class="btn btn-sm btn-outline-danger"
                                            onclick="confirmAction('delete', [[${brand.id}]], '[[${brand.name}]]')"
                                            title="Xóa">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Discount Modal -->
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>    
    <script>
        function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const overlay = document.getElementById('overlay');

        if (window.innerWidth <= 768) {
            // Mobile behavior
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        } else {
            // Desktop behavior
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        }
    }

    // Submenu toggle
    function toggleSubmenu(menuId) {
        const submenu = document.getElementById(menuId);
        submenu.classList.toggle('show');
    }

    // Show section
    function showSection(sectionId) {
        // Hide all sections
        const sections = document.querySelectorAll('.content-section');
        sections.forEach(section => {
            section.classList.remove('active');
        });

        // Show selected section
        document.getElementById(sectionId).classList.add('active');

        // Update active nav link
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.classList.remove('active');
        });

        // Hide sidebar on mobile after selection
        if (window.innerWidth <= 768) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        }
    }
    </script>
</body>
</html>
