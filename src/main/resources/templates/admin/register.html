<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký Admin - Fashion Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: none;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      border-radius: 20px;
    }
    .form-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 2rem;
      border-radius: 20px 20px 0 0;
      text-align: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      padding: 12px 30px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }
    .form-control {
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 12px 15px;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-xl-5">
      <div class="card auth-card">
        <div class="form-header">
          <h2 class="fw-bold mb-2">Đăng ký Admin</h2>
          <p class="mb-0 opacity-75">Tạo tài khoản quản trị viên mới</p>
        </div>

        <div class="card-body p-4">
          <!-- Error Message -->
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <form th:action="@{/admin/register}" th:object="${registrationDto}" method="post">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">
                <i class="fas fa-user me-2"></i>Tên đăng nhập *
              </label>
              <input type="text" th:field="*{username}" class="form-control" id="username" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">
                <i class="fas fa-envelope me-2"></i>Email *
              </label>
              <input type="email" th:field="*{email}" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">
                <i class="fas fa-lock me-2"></i>Mật khẩu *
              </label>
              <input type="password" th:field="*{password}" class="form-control" id="password" required minlength="6">
              <div class="form-text">Mật khẩu phải có ít nhất 6 ký tự</div>
            </div>

            <div class="mb-4">
              <label for="confirmPassword" class="form-label fw-semibold">
                <i class="fas fa-lock me-2"></i>Xác nhận mật khẩu *
              </label>
              <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
              <i class="fas fa-user-plus me-2"></i>Đăng ký Admin
            </button>
          </form>

          <div class="text-center">
            <p class="mb-0">Đã có tài khoản?
              <a th:href="@{/admin/login}" class="text-decoration-none fw-semibold">Đăng nhập ngay</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Validate password confirmation
  document.getElementById('confirmPassword').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirmPassword = this.value;

    if (password !== confirmPassword) {
      this.setCustomValidity('Mật khẩu xác nhận không khớp');
    } else {
      this.setCustomValidity('');
    }
  });
</script>
</body>
</html>
