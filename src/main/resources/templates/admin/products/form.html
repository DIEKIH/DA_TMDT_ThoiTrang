    <form th:action="@{${formAction}}" th:object="${product}" method="post" enctype="multipart/form-data">

        <!-- Tên sản phẩm -->
        <div class="mb-3">
            <label for="name" class="form-label">Tên sản phẩm</label>
            <input type="text" class="form-control" id="name" th:field="*{name}">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!-- Mô tả -->
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <!-- Kích thước -->
        <div class="mb-3">
            <label for="size" class="form-label">Kích thước</label>
            <input type="text" class="form-control" id="size" th:field="*{size}">
            <div class="text-danger" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></div>
        </div>

        <!-- Màu sắc -->
        <div class="mb-3">
            <label for="color" class="form-label">Màu sắc</label>
            <input type="text" class="form-control" id="color" th:field="*{color}">
            <div class="text-danger" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></div>
        </div>

        <!-- Số lượng tồn -->
        <div class="mb-3">
            <label for="quantity" class="form-label">Số lượng tồn</label>
            <input type="number" class="form-control" id="quantity" min="0" th:field="*{quantity}">
            <div class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
        </div>

        <!-- Giá bán -->
        <div class="mb-3">
            <label for="price" class="form-label">Giá bán (VNĐ)</label>
            <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}">
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <!-- Mã SKU -->
        <div class="mb-3">
            <label for="sku" class="form-label">Mã SKU</label>
            <input type="text" class="form-control" id="sku" th:field="*{sku}">
            <div class="text-danger" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
        </div>

        <!-- Danh mục -->
        <div class="mb-3">
            <label for="categoryId" class="form-label">Danh mục</label>
            <select class="form-select" id="categoryId" th:field="*{categoryId}">
                <option value="">-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>

        <!-- Thương hiệu -->
        <div class="mb-3">
            <label for="brandId" class="form-label">Thương hiệu</label>
            <select class="form-select" id="brandId" th:field="*{brandId}">
                <option value="">-- Chọn thương hiệu --</option>
                <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('brandId')}" th:errors="*{brandId}"></div>
        </div>

        <!-- Ảnh đại diện -->
        <div class="mb-3">
            <label for="imageFile" class="form-label">Ảnh đại diện</label>
            <input class="form-control" type="file" id="imageFile" name="imageFile">
        </div>

        <!-- Ảnh chi tiết -->
        <div class="mb-3">
            <label for="imageFiles" class="form-label">Ảnh chi tiết</label>
            <input class="form-control" type="file" id="imageFiles" name="imageFiles" multiple>
        </div>

        <!-- Trạng thái -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="isActive">
            <label class="form-check-label" for="isActive">Kích hoạt</label>
        </div>

        <!-- Nút gửi -->
        <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'"></button>
        <a href="/admin/products" class="btn btn-secondary ms-2">Quay lại</a>
    </form>
