<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang quản trị - Fashion Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white;
            padding-top: 1rem;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
        }

        .sidebar a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid white;
        }

        .card {
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .dashboard-icon {
            font-size: 2rem;
            color: #764ba2;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar">
            <div class="text-center mb-4">
                <h4><i class="fas fa-user-shield me-2"></i>Admin Panel</h4>
            </div>

            <a href="#"><i class="fas fa-users me-2"></i>Khách hàng</a>
            <a href="#"><i class="fas fa-tags me-2"></i>Voucher & Giảm giá</a>
            <a href="#"><i class="fas fa-th-list me-2"></i>Danh mục & Thương hiệu</a>
            <a href="#"><i class="fas fa-boxes me-2"></i>Sản phẩm</a>
            <a href="#"><i class="fas fa-shopping-cart me-2"></i>Đơn hàng</a>
            <a href="#"><i class="fas fa-warehouse me-2"></i>Tồn kho</a>
            <a href="#"><i class="fas fa-chart-line me-2"></i>Thống kê</a>
            <a href="/logout"><i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</a>
        </nav>

        <!-- Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">Xin chào, <span th:text="${user.username}">Admin</span> 👋</h2>

            <!-- Dashboard cards -->
            <div class="row g-4">
                <div class="col-md-6 col-lg-3">
                    <div class="card p-4 text-center">
                        <div class="dashboard-icon mb-2"><i class="fas fa-users"></i></div>
                        <h5>Khách hàng</h5>
                        <p class="mb-0">Quản lý thông tin người dùng</p>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="card p-4 text-center">
                        <div class="dashboard-icon mb-2"><i class="fas fa-box-open"></i></div>
                        <h5>Sản phẩm</h5>
                        <p class="mb-0">Quản lý & cập nhật sản phẩm</p>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="card p-4 text-center">
                        <div class="dashboard-icon mb-2"><i class="fas fa-chart-bar"></i></div>
                        <h5>Thống kê</h5>
                        <p class="mb-0">Xem doanh số, báo cáo</p>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="card p-4 text-center">
                        <div class="dashboard-icon mb-2"><i class="fas fa-warehouse"></i></div>
                        <h5>Tồn kho</h5>
                        <p class="mb-0">Theo dõi và cập nhật tồn kho</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
